  <title id="cost-chart-title">Offline score and cost per 100 test examples</title>
  <desc id="cost-chart-desc">
    The horizontal axis shows cost in USD on a logarithmic scale; the vertical axis spans scores
    from 40 to 90. Each point is labeled with its model name. API costs are recorded charges; local
    costs are generation-stage estimates, not total deployment costs.
  </desc>

